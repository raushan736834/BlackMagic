spring.application.name=BlackMagic
server.port=8080

# MongoDB Configuration
spring.mongodb.uri=${MONGO_URI}
spring.mongodb.database=${MONGO_DB}


spring.data.mongodb.auto-index-creation=true


# Payment Gateway (Razorpay)
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}

# WebSocket Configuration
websocket.allowed.origins=http://localhost:3000,http://localhost:8080

# Session Configuration
session.inactive.timeout.minutes=30
session.auto.close.hours=4

# Order Configuration
order.cancellation.window.minutes=5
order.payment.timeout.minutes=15

# Security
jwt.secret=${JWT_SECRET}
jwt.expiration.ms=86400000

# File Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.restaurant.ordering=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG
